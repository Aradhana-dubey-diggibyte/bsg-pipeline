## Databricks Asset Bundle Configuration
## ETL Pipeline: Credit Card Fraud Detection
## Targets: Dev and Production environments

bundle:
  name: bsg-creditcard-fraud-pipeline

include:
  - ./resources/pipeline_job.yml

sync:
  include:
    - ./src
    - ./conf

variables:
  environment:
    description: "Environment name"
    default: "dev"
  
  workspace_path:
    description: "Workspace path for pipeline files"
    default: "Shared/.bundle/bsg-creditcard-fraud-pipeline"

targets:
  dev:
    variables:
      environment: "dev"
      workspace_path: "Shared/.bundle/bsg-creditcard-fraud-pipeline/dev"
    
    workspace:
      host: "https://adb-7488500312027058.18.azuredatabricks.net"
      profile: "DEFAULT"
      root_path: "/Shared/.bundle/bsg-creditcard-fraud-pipeline/dev/${workspace.current_user.userName}"

  prod:
    variables:
      environment: "prod"
      workspace_path: "Shared/.bundle/bsg-creditcard-fraud-pipeline/prod"
    
    workspace:
      host: "https://dbc-629d7ac5-f465.cloud.databricks.com"
      profile: "DEFAULT"
      root_path: "/Shared/.bundle/bsg-creditcard-fraud-pipeline/prod/${workspace.current_user.userName}"
