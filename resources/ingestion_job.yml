## Ingestion Job - Download from Kaggle
## Runs first in the pipeline

resources:
  jobs:
    ingestion_job:
      name: "creditcard-${var.environment}-ingestion"
      
      tasks:
        - task_key: "ingest_kaggle"
          description: "Ingest raw data from Kaggle"
          
          notebook_task:
            notebook_path: "/Workspace/Shared/.bundle/bsg-creditcard-fraud-pipeline/${var.environment}/src/00_ingest_kaggle.py"
            base_parameters:
              output_path: "/Volumes/data_engineering_workshop/creditcard/raw"
              dataset_name: "mlg-ulb/creditcardfraud"
          
          existing_cluster_id: "0422-125216-1t83bm6v"
          
          timeout_seconds: 3600
          max_retries: 2
      
      schedule:
        quartz_cron_expression: "0 0 1 * * ?"  # Monthly on 1st at midnight
        timezone_id: "UTC"
        pause_status: "UNPAUSED"
      
      max_concurrent_runs: 1
      timeout_seconds: 7200
      
      tags:
        environment: "${var.environment}"
        layer: "ingestion"
        pipeline: "creditcard-fraud"
