## Complete Credit Card Fraud Detection Pipeline
## Single unified job with all tasks: Ingestion → Bronze → Silver → Gold
## All tasks use Jupyter Notebooks (.ipynb format)

resources:
  jobs:
    pipeline_job:
      name: "creditcard-${var.environment}-pipeline"
      description: "Complete ETL Pipeline: Ingestion → Bronze → Silver → Gold (Notebook Format)"
      
      tasks:
        # ========== INGESTION PHASE ==========
        - task_key: "ingest_kaggle"
          description: "Ingest raw data from Kaggle"
          
          notebook_task:
            notebook_path: "/Repos/${workspace.current_user.userName}/bsg-pipeline/src/00_ingest_kaggle"
            base_parameters:
              dataset_name: "mlg-ulb/creditcardfraud"
          
          existing_cluster_id: "0422-125216-1t83bm6v"
          timeout_seconds: 3600
          max_retries: 2
        
        # ========== BRONZE PHASE ==========
        - task_key: "bronze_transform"
          description: "Load raw CSV, validate schema, store as Delta table"
          
          notebook_task:
            notebook_path: "/Repos/${workspace.current_user.userName}/bsg-pipeline/src/01_bronze"
          
          existing_cluster_id: "0422-125216-1t83bm6v"
          timeout_seconds: 1800
          max_retries: 2
          
          depends_on:
            - task_key: "ingest_kaggle"
        
        # ========== SILVER PHASE ==========
        # Silver Phase 1: Deduplication
        - task_key: "silver_dedup"
          description: "Remove duplicate transactions"
          
          notebook_task:
            notebook_path: "/Repos/${workspace.current_user.userName}/bsg-pipeline/src/05_silver"
          
          existing_cluster_id: "0422-125216-1t83bm6v"
          timeout_seconds: 900
          max_retries: 2
          
          depends_on:
            - task_key: "bronze_transform"
        
        # Silver Phase 2: Standardization
        - task_key: "silver_standardize"
          description: "Normalize amounts, create time features"
          
          notebook_task:
            notebook_path: "/Workspace/Shared/.bundle/bsg-creditcard-fraud-pipeline/${var.environment}/${workspace.current_user.userName}/files/src/03_silver_standardise"
          
          existing_cluster_id: "0422-125216-1t83bm6v"
          timeout_seconds: 900
          max_retries: 2
          
          depends_on:
            - task_key: "silver_dedup"
        
        # Silver Phase 3: PII Masking
        - task_key: "silver_mask"
          description: "Apply data governance and PII masking"
          
          notebook_task:
            notebook_path: "/Workspace/Shared/.bundle/bsg-creditcard-fraud-pipeline/${var.environment}/${workspace.current_user.userName}/files/src/04_silver_pii_mask"
          
          existing_cluster_id: "0422-125216-1t83bm6v"
          timeout_seconds: 600
          max_retries: 1
          
          depends_on:
            - task_key: "silver_standardize"
        
        # Silver Phase 4: Feature Engineering
        - task_key: "silver_features"
          description: "Engineer 50+ features for ML models"
          
          notebook_task:
            notebook_path: "/Workspace/Shared/.bundle/bsg-creditcard-fraud-pipeline/${var.environment}/${workspace.current_user.userName}/files/src/05_silver_derived"
          
          existing_cluster_id: "0422-125216-1t83bm6v"
          timeout_seconds: 1200
          max_retries: 2
          
          depends_on:
            - task_key: "silver_mask"
        
        # ========== GOLD PHASE ==========
        # Gold Phase 1: Risk Scoring
        - task_key: "gold_risk_score"
          description: "Generate fraud risk scores (0-100%)"
          
          notebook_task:
            notebook_path: "/Workspace/Shared/.bundle/bsg-creditcard-fraud-pipeline/${var.environment}/${workspace.current_user.userName}/files/src/06_gold_risk_score"
          
          existing_cluster_id: "0422-125216-1t83bm6v"
          timeout_seconds: 900
          max_retries: 1
          
          depends_on:
            - task_key: "silver_features"
        
        # Gold Phase 2: Rolling Metrics
        - task_key: "gold_metrics"
          description: "Create hourly and daily aggregations"
          
          notebook_task:
            notebook_path: "/Workspace/Shared/.bundle/bsg-creditcard-fraud-pipeline/${var.environment}/${workspace.current_user.userName}/files/src/07_gold_rolling_metrics"
          
          existing_cluster_id: "0422-125216-1t83bm6v"
          timeout_seconds: 900
          max_retries: 1
          
          depends_on:
            - task_key: "gold_risk_score"
        
        # Gold Phase 3: KPI Mart
        - task_key: "gold_kpi_mart"
          description: "Build business KPI tables for dashboards"
          
          notebook_task:
            notebook_path: "/Workspace/Shared/.bundle/bsg-creditcard-fraud-pipeline/${var.environment}/${workspace.current_user.userName}/files/src/08_gold_kpi_mart"
          
          existing_cluster_id: "0422-125216-1t83bm6v"
          timeout_seconds: 600
          max_retries: 1
          
          depends_on:
            - task_key: "gold_metrics"
      
      # Single schedule for entire pipeline
      schedule:
        quartz_cron_expression: "0 0 1 * * ?"  # Monthly on 1st at midnight UTC
        timezone_id: "UTC"
        pause_status: "UNPAUSED"
      
      max_concurrent_runs: 1
      timeout_seconds: 14400  # 4 hours total
      
      tags:
        environment: "${var.environment}"
        layer: "complete"
        format: "notebook"
        pipeline: "creditcard-fraud"
