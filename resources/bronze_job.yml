## Bronze Layer Job - Raw Data Validation & Ingestion
## Dependencies: ingestion_job

resources:
  jobs:
    bronze_job:
      name: "creditcard-${environment}-bronze"
      description: "Bronze Layer: Schema validation and data ingestion"
      
      tasks:
        - task_key: "bronze_transform"
          description: "Load raw CSV, validate schema, store as Parquet"
          
          spark_python_task:
            python_file: "dbfs:/Workspace/${workspace_path}/src/01_bronze_schema.py"
            parameters:
              - "data/raw/creditcard.csv"
              - "dbfs:/Workspace/${workspace_path}/src/bronze"
              - "${environment}"
          
          existing_cluster_id: "0422-125216-1t83bm6v"
          
          timeout_seconds: 1800
          max_retries: 2
          
      schedule:
        quartz_cron_expression: "0 30 1 * * ?"  # Daily at 01:30 UTC
        timezone_id: "UTC"
        pause_status: "UNPAUSED"
      
      max_concurrent_runs: 1
      timeout_seconds: 3600
      
      tags:
        environment: "${environment}"
        layer: "bronze"
        pipeline: "creditcard-fraud"
