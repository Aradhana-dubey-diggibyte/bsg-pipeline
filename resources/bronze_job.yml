## Bronze Layer Job - Raw Data Validation & Ingestion
## Dependencies: ingestion_job

resources:
  jobs:
    bronze_job:
      name: "creditcard-${var.environment}-bronze"
      
      tasks:
        - task_key: "bronze_transform"
          description: "Load raw CSV, validate schema, store as Delta table"
          
          spark_python_task:
            python_file: "/Workspace/Shared/.bundle/bsg-creditcard-fraud-pipeline/${var.environment}/src/01_bronze_schema.py"
            parameters:
              - "/Volumes/data_engineering_workshop/creditcard/raw/creditcard.csv"
              - "/Volumes/data_engineering_workshop/creditcard/bronze"
              - "${var.environment}"
          
          existing_cluster_id: "0422-125216-1t83bm6v"
          
          timeout_seconds: 1800
          max_retries: 2
          
      schedule:
        quartz_cron_expression: "0 30 1 * * ?"  # Daily at 01:30 UTC
        timezone_id: "UTC"
        pause_status: "UNPAUSED"
      
      max_concurrent_runs: 1
      timeout_seconds: 3600
      
      tags:
        environment: "${var.environment}"
        layer: "bronze"
        pipeline: "creditcard-fraud"
