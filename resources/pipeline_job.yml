resources:
  jobs:
    pipeline_job:
      name: "creditcard-${var.environment}-pipeline"
      description: "Credit Card Fraud Detection Pipeline: Bronze → Silver → Gold"

      tasks:
        # -------- BRONZE --------
        - task_key: bronze
          notebook_task:
            notebook_path: ../src/01_bronze.ipynb

          existing_cluster_id: "0422-125216-1t83bm6v"
          timeout_seconds: 3600
          max_retries: 2

        # -------- SILVER --------
        - task_key: silver
          notebook_task:
            notebook_path: ../src/05_silver.ipynb

          existing_cluster_id: "0422-125216-1t83bm6v"
          timeout_seconds: 1800
          max_retries: 2

          depends_on:
            - task_key: bronze

        # -------- GOLD --------
        - task_key: gold
          notebook_task:
            notebook_path: ../src/08_gold.ipynb

          existing_cluster_id: "0422-125216-1t83bm6v"
          timeout_seconds: 1200
          max_retries: 1

          depends_on:
            - task_key: silver

      max_concurrent_runs: 1
      timeout_seconds: 14400

      tags:
        environment: "${var.environment}"
        layer: "complete"
        pipeline: "creditcard-fraud"