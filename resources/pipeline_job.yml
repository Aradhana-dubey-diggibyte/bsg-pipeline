## Complete Credit Card Fraud Detection Pipeline
## Single unified job with all tasks: Ingestion → Bronze → Silver → Gold

resources:
  jobs:
    pipeline_job:
      name: "creditcard-${var.environment}-pipeline"
      description: "Credit Card Fraud Detection Pipeline: Bronze → Silver → Gold"
      
      tasks:
        # ========== BRONZE PHASE ==========
        - task_key: "bronze"
          description: "Ingest data from Kaggle and perform bronze-level transformation"
          
          notebook_task:
            notebook_path: "/Shared/.bundle/bsg-pipeline/dev/aradhana.dubey@diggibyte.com/files/src/01_bronze"
          
          existing_cluster_id: "0422-125216-1t83bm6v"
          timeout_seconds: 3600
          max_retries: 2
        
        # ========== SILVER PHASE ==========
        - task_key: "silver"
          description: "Execute all silver transformations: dedup → standardize → mask → features"
          
          notebook_task:
            notebook_path: "/Shared/.bundle/bsg-pipeline/dev/aradhana.dubey@diggibyte.com/files/src/05_silver"
          
          existing_cluster_id: "0422-125216-1t83bm6v"
          timeout_seconds: 1800
          max_retries: 2
          
          depends_on:
            - task_key: "bronze"
        
        # ========== GOLD PHASE ==========
        - task_key: "gold"
          description: "Execute all gold tasks: risk scoring → metrics → KPI mart"
          
          notebook_task:
            notebook_path: "/Shared/.bundle/bsg-pipeline/dev/aradhana.dubey@diggibyte.com/files/src/08_gold"
          
          existing_cluster_id: "0422-125216-1t83bm6v"
          timeout_seconds: 1200
          max_retries: 1
          
          depends_on:
            - task_key: "silver"
      
      # Single schedule for entire pipeline
      schedule:
        quartz_cron_expression: "0 0 1 * * ?"  # Monthly on 1st at midnight UTC
        timezone_id: "UTC"
        pause_status: "UNPAUSED"
      
      max_concurrent_runs: 1
      timeout_seconds: 14400  # 4 hours total
      
      tags:
        environment: "${var.environment}"
        layer: "complete"
        pipeline: "creditcard-fraud"
