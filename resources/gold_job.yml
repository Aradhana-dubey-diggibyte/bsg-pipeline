## Gold Layer Job - Analytics & Business Intelligence
## Includes: Risk Scoring, Rolling Metrics, KPI Mart
## Dependencies: silver_job

resources:
  jobs:
    gold_job:
      name: "creditcard-${environment}-gold"
      description: "Gold Layer: Risk scoring, metrics aggregations, KPI dashboards"
      
      tasks:
        # Gold Phase 1: Risk Scoring
        - task_key: "gold_risk_score"
          description: "Generate fraud risk scores (0-100%)"
          
          spark_python_task:
            python_file: "dbfs:/Workspace/${workspace_path}/src/06_gold_risk_score.py"
            parameters:
              - "dbfs:/Workspace/${workspace_path}/src/silver/creditcard_silver_final"
              - "dbfs:/Workspace/${workspace_path}/src/gold"
              - "${environment}"
          
          existing_cluster_id: "0422-125216-1t83bm6v"
          timeout_seconds: 900
          max_retries: 1
          


        # Gold Phase 2: Rolling Metrics (Hourly/Daily)
        - task_key: "gold_metrics"
          description: "Create hourly and daily aggregations"
          
          spark_python_task:
            python_file: "dbfs:/Workspace/${workspace_path}/src/07_gold_rolling_metrics.py"
            parameters:
              - "dbfs:/Workspace/${workspace_path}/src/gold/creditcard_gold_risk_scores"
              - "dbfs:/Workspace/${workspace_path}/src/gold"
              - "${environment}"
          
          existing_cluster_id: "0422-125216-1t83bm6v"
          timeout_seconds: 900
          max_retries: 1
          
          depends_on:
            - task_key: "gold_risk_score"
              outcome: "SUCCEEDED"

        # Gold Phase 3: KPI Mart
        - task_key: "gold_kpi_mart"
          description: "Build business KPI tables for dashboards"
          
          spark_python_task:
            python_file: "dbfs:/Workspace/${workspace_path}/src/08_gold_kpi_mart.py"
            parameters:
              - "dbfs:/Workspace/${workspace_path}/src/gold/creditcard_gold_risk_scores"
              - "dbfs:/Workspace/${workspace_path}/src/gold"
              - "${environment}"
          
          existing_cluster_id: "0422-125216-1t83bm6v"
          timeout_seconds: 600
          max_retries: 1
          
          depends_on:
            - task_key: "gold_metrics"
              outcome: "SUCCEEDED"

      schedule:
        quartz_cron_expression: "0 15 2 * * ?"  # Daily at 02:15 UTC
        timezone_id: "UTC"
        pause_status: "UNPAUSED"
      
      max_concurrent_runs: 1
      timeout_seconds: 7200
      
      tags:
        environment: "${environment}"
        layer: "gold"
        pipeline: "creditcard-fraud"
